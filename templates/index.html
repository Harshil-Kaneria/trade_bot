<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Trading Bot Dashboard</h1>
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="mb-3">Buy/Sell Trades</h2>
            <strong id="price"></strong>
            <strong id="total-profit"></strong>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Stock Symbol</th>
                        <th>Buy Price</th>
                        <th>Sell Price</th>
                        <th>Quantity</th>
                        <th>Buy Time</th>
                        <th>Sell Time</th>
                        <th>Profit</th>
                    </tr>
                </thead>
                <tbody id="profit-table">
                    {% for trade in trades %}
                    <tr>
                        <td>{{ trade[0] }}</td>
                        <td>{{ trade[1] }}</td>
                        <td>{{ trade[2] }}</td>
                        <td>{{ trade[3] }}</td>
                        <td>{{ trade[4] }}</td>
                        <td>{{ trade[5] }}</td>
                        <td>{{ trade[6] }}</td>
                        <td>{{ trade[7] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Toastr JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
        const socket = io();
        socket.on('trade_event', function(data) {
            if (data.event === 'Buy' || data.event === 'Sell') {
                if(data.event === 'Buy'){
                    toastr.success(data.message, data.event);
                }else{
                    toastr.info(data.message, data.event);
                }
                setTimeout(()=>{
                    location.reload();
                },2000)
            }else{
                toastr.success(data.message, data.event);
            }
        });
        socket.on('price_tick', function(data) {
            document.title = data.data.last_price + ' Bot';
            $("#price").text('Price: ₹'+data.data.last_price)
        });
    </script>
    <script>
        $(document).ready(function () {
            let totalProfit = 0;
            $('#profit-table tr').each(function () {
                const profitValue = parseFloat($(this).find('td:eq(7)').text());
                if (!isNaN(profitValue)) {
                    totalProfit += profitValue;
                }
            });
            $('#total-profit').text('Total Profit: ₹' + totalProfit.toFixed(2));
        });
    </script>
</body>
</html>
